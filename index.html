<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AI Chart Scanner</title>
    <meta name="description" content="Mobile-first trading chart scanner powered by AI vision to analyze candlestick structure, detect key levels, and deliver validated setups." />
    <meta property="og:title" content="AI Chart Scanner" />
    <meta property="og:description" content="Mobile-first trading chart scanner powered by AI vision to analyze candlestick structure, detect key levels, and deliver validated setups." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI Scanner" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Filter benign container HMR websocket notices
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('[vite] failed to connect') || args[0].includes('vite-plugin-pwa:dev-ready'))) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
